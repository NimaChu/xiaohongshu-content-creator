name: Validate xhs-imagen

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_project.py references/project.template.json
      - run: python3 scripts/make_prompt_pack.py references/project.template.json --output-dir /tmp/xhs-prompts
      - run: python3 scripts/render_xiaohongshu_project.py references/project.template.json --output-dir /tmp/xhs-render --prompts-only
